[versioneer]
VCS = git
style = pep440
versionfile_source = prekd/_version.py
versionfile_build = prekd/_version.py
tag_prefix = ''

[options]
python_requires = >=3.10
install_requires =
    pandas
    numpy
    rdkit
    tqdm
    networkx
    shortuuid
    scikit-learn
    # PreKd builds its message-passing layers on Keras 3 / TF 2.20. The nfp release
    # on PyPI (0.3.x) predates that and fails at model build, so the dependency is
    # pinned to the TF 2.20 branch of the upstream repository.
    nfp @ git+https://github.com/NREL/nfp.git@8500673ad11a34a438c4f62a23a149cc100ac440
    tensorflow>=2.20

[options.extras_require]
test = pytest
